<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis finanzas</title>
<style>
:root{--bg:#f6f4ef;--card:#ffffff;--ink:#1a1a1a;--mut:#55606a;--line:#ddd8cc;--acc:#b85c0a;--dark:#12263a;--ok:#1f7a4d;--bad:#b3261e;--warn:#8a6100;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12181f;--card:#1b242d;--ink:#f0ede6;--mut:#9aa7b3;--line:#2c3945;--acc:#f2a65a;--dark:#0c1117;--ok:#5ccf93;--bad:#ff8a80;--warn:#f2c14e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12181f;--card:#1b242d;--ink:#f0ede6;--mut:#9aa7b3;--line:#2c3945;--acc:#f2a65a;--dark:#0c1117;--ok:#5ccf93;--bad:#ff8a80;--warn:#f2c14e;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Helvetica,Arial,sans-serif}
main{max-width:920px;margin:0 auto;padding:20px 16px 48px}
h1{font:400 32px Georgia,serif;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 16px}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tabs button{flex:1;padding:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:600 15px inherit;cursor:pointer}
.tabs button.on{background:var(--dark);color:#f6f4ef;border-color:var(--dark)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.card small{color:var(--mut);display:block}.card b{font-size:24px}
.bar{height:14px;background:var(--line);border-radius:8px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--line);font-size:15px}
th{color:var(--mut);font-weight:600}
input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:140px}
input.w{max-width:none;width:100%;box-sizing:border-box}
.btn{padding:7px 12px;border-radius:8px;border:1px solid var(--acc);background:transparent;color:var(--acc);font:600 14px inherit;cursor:pointer}
.btn.f{background:var(--acc);color:var(--bg)}
.st{font-weight:700}.Pagado{color:var(--ok)}.Atrasado{color:var(--bad)}.Parcial{color:var(--warn)}.Pendiente{color:var(--mut)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.row label{display:flex;flex-direction:column;font-size:13px;color:var(--mut);gap:2px}
.ex{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.note{color:var(--mut);font-size:13px;margin-top:12px}

input{font-size:16px}
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ex{flex-wrap:wrap}
@media (pointer:coarse){input,.btn,.tabs button{min-height:44px}}
@media (max-width:1024px){th,td{padding:8px 4px}input[type=date]{max-width:150px}}
@media (max-width:700px){
 main{padding-top:14px}h1{font-size:26px}
 .grid{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
 .wrap{overflow:visible}
 table{min-width:0;display:block}tbody{display:block}
 table tr:has(th){display:none}
 tr.dr{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;padding:14px 0 6px;border-top:1px solid var(--line)}
 tr.dr td{display:block;border:0;padding:0}
 tr.dr td::before{content:attr(data-label);display:block;font-size:12px;color:var(--mut)}
 tr.dr td:first-child{grid-column:1/-1;font-weight:700}
 tr.dr td:first-child::before{content:"Pago"}
 tr.dr td:last-child{grid-column:1/-1}
 tr.dr td:last-child::before{display:none}
 tr.dr td:last-child .btn{width:100%}
 tr.nr{display:block;padding-bottom:12px;border-bottom:1px solid var(--line)}
 tr.nr td{display:block;border:0;padding:0}tr.nr td:first-child{display:none}
 input{max-width:none;width:100%;box-sizing:border-box;min-height:44px}
 .btn{min-height:44px}
 .row{flex-direction:column;align-items:stretch}.row>*{width:100%}
 .row label{width:100%}
}
textarea{width:100%;box-sizing:border-box;font:14px/1.4 Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px}
a.btn{text-decoration:none;display:inline-block;text-align:center;box-sizing:border-box;line-height:1.4}
body.auth h1,body.auth .sub,body.auth #hd{display:none}
.lg{max-width:400px;margin:6vh auto 0;text-align:center;animation:up .35s ease}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.lg{animation:none}}
.lg .logo{width:68px;height:68px;border-radius:20px;background:var(--dark);color:#f6f4ef;display:grid;place-items:center;font-size:34px;margin:0 auto 16px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.lg h2{font:400 32px Georgia,serif;margin:0 0 4px}
.lg .s{color:var(--mut);margin:0 0 22px}
.lg .box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;text-align:left;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.lg label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin-bottom:14px}
.lg .fld{position:relative;margin-top:6px}
.lg input{width:100%;box-sizing:border-box;max-width:none;padding:13px 14px;font-size:16px;border-radius:12px}
.lg input:focus{outline:2px solid var(--acc);outline-offset:1px}
.lg .eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--acc);font:600 13px inherit;cursor:pointer;padding:8px}
.lg .pw input{padding-right:84px}
.lg .go{width:100%;padding:14px;font-size:16px;border-radius:12px;min-height:48px}
.lerr{color:var(--bad);font-size:14px;min-height:20px;margin:0 0 10px}
.lg .foot{color:var(--mut);font-size:12px;margin-top:16px}
</style></head><body><main>
<div id="hd" style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px"><h1>Mis finanzas</h1><button class="btn" id="lo" data-act="logout" style="display:none">Cerrar sesión</button></div><p class="sub">Control del préstamo familiar.</p>
<div class="tabs"><button data-tab="loan">Préstamo</button><button data-tab="bud">Presupuesto</button></div>
<p class="note" id="msg" style="color:var(--bad);font-weight:700;margin:0 0 12px"></p>
<div id="app"></div>
<p class="note" id="sync"></p>
</main>
<script>
const DEF={total:43240.27,monthly:5000,day:30,start:'2026-11-30',pay:Array.from({length:9},()=>({a:0,d:'',n:''}))};
const BDEF={gs:'2026-10-30',dayA:15,amtA:5700,dayB:30,amtB:8700,sm:2200,exp:[],sav:[],goal:0,debts:[],stm:[]};
const cl=o=>JSON.parse(JSON.stringify(o));
let S=cl(DEF),B=cl(BDEF),tab='loan',ref=null,bref=null,owner=false,err='',cfm='',lastW=0,failed=false,cloud=false;
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const M=n=>(+n||0).toLocaleString('es-MX',{style:'currency',currency:'MXN'});
const r2=n=>Math.round(n*100)/100;
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const sched=n=>n<9?+S.monthly:r2(S.total-8*S.monthly);
const mkD=(y,m0,d)=>{const x=new Date(y,m0,1),dm=new Date(x.getFullYear(),x.getMonth()+1,0).getDate();return x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(Math.min(d,dm))};
const due=n=>{const [y,m]=S.start.split('-').map(Number);return mkD(y,m-1+n-1,S.day||30)};
const fmtD=s=>s?s.split('-').reverse().join('/'):'';
const fail=e=>{failed=true;err='No se pudo guardar en la nube ('+((e&&(e.code||e.message))||'error')+'). Tus cambios se guardan solo en este navegador.';render()};
window.addEventListener('error',e=>{err='Error: '+e.message;const m=document.getElementById('msg');if(m)m.textContent=err});
const persist=(k,o)=>{try{localStorage.setItem(k,JSON.stringify(o))}catch(e){}};
try{const l=localStorage.getItem('fin');if(l)S=Object.assign({},DEF,JSON.parse(l));const b=localStorage.getItem('finb');if(b)B=Object.assign({},BDEF,JSON.parse(b))}catch(e){}
function cloudSet(r,o){try{const q=r.set({j:JSON.stringify(o)});if(q&&q.then)q.then(()=>{cloud=true;render()},fail)}catch(e){fail(e)}}
function saveL(){err='';S.t=Date.now();const o={t:S.t,total:S.total,monthly:S.monthly,start:S.start,pay:S.pay};persist('fin',o);render();if(ref&&!failed)cloudSet(ref,o)}
function saveB(){err='';B.t=Date.now();persist('finb',B);render();if(bref&&!failed)cloudSet(bref,B)}
const stt=(a,s,du)=>{a=+a||0;if(a>=s-0.005)return'Pagado';if(a>0)return'Parcial';return today()>du?'Atrasado':'Pendiente'};
function status(i){return stt(S.pay[i].a,sched(i+1),due(i+1))}
const addM=(s,n)=>{const [y,m,d]=s.split('-').map(Number);return mkD(y,m-1+n,d)};
const mens=D=>D.mo>0?D.mo:r2(D.total/D.months),ds=(D,k)=>k<D.months?mens(D):Math.max(0,r2(D.total-(D.months-1)*mens(D)));
const dpaid=D=>D.pay.reduce((t,p)=>t+(+p.a||0),0),ddone=D=>dpaid(D)>=D.total-0.005;
function curPeriod(dt){const t=dt||today(),[y,m]=t.split('-').map(Number),L=[];
 for(const o of [-1,0,1]){L.push({s:mkD(y,m-1+o,16),k:'A'});L.push({s:mkD(y,m-1+o,B.dayB),k:'B'})}
 L.sort((a,b)=>a.s<b.s?-1:a.s>b.s?1:0);let i=0;while(i+1<L.length&&L[i+1].s<=t)i++;return{cur:L[i],next:L[i+1]}}
const loanDone=()=>S.pay.every((p,i)=>status(i)==='Pagado');
function stmHtml(){
 const t=today(),L=B.stm.slice().sort((a,b)=>(a.l||'9').localeCompare(b.l||'9')),pend=B.stm.filter(x=>!x.pd).reduce((s,x)=>s+(+x.sal||0),0);
 let h=`<div class="card" style="margin-top:12px"><h3 style="margin:0 0 4px">Estados de cuenta</h3><p class="note" style="margin:0 0 8px">Por pagar: <b>${M(pend)}</b></p>`;
 if(!L.length)h+=`<p class="note">Aún no hay estados de cuenta. Agrega el de cada tarjeta cuando te llegue.</p>`;
 L.forEach(x=>{const st=x.pd?'Pagado':(x.l&&x.l<t?'Atrasado':'Pendiente'),lb=st==='Pendiente'?'Por pagar':st==='Atrasado'?'Vencido':'Pagado';
  h+=`<div class="ex" style="align-items:center"><span><b>${esc(x.c)}</b> · ${esc((x.m||'').split('-').reverse().join('/'))}<br><span class="note">Saldo ${M(x.sal)} · Mínimo ${M(x.min)} · Límite ${fmtD(x.l)}${x.n?' · '+esc(x.n):''}</span></span>
  <span><span class="st ${st}">${lb}</span> ${x.pd?`<button class="btn" data-act="stundo" data-x="${x.id}">Deshacer</button>`:`<button class="btn f" data-act="stpay" data-x="${x.id}">Marcar pagado</button>`} <button class="btn" data-act="stdel" data-x="${x.id}">Quitar</button></span></div>`});
 h+=`<div class="row" style="margin-top:12px"><input id="xc" placeholder="Tarjeta (NU, BBVA…)"><label>Mes del estado<input id="xm" type="month" value="${t.slice(0,7)}"></label><label>Saldo a pagar<input id="xs" type="number" step="0.01"></label><label>Pago mínimo<input id="xi" type="number" step="0.01"></label><label>Fecha límite<input id="xl" type="date"></label><input id="xn" placeholder="Nota (opcional)"><button class="btn f" data-act="stadd">Agregar estado</button></div></div>`;
 return h}
const nx30=()=>{const d=new Date();let c=mkD(d.getFullYear(),d.getMonth(),30);if(c<=today())c=mkD(d.getFullYear(),d.getMonth()+1,30);return c};
function debtsHtml(){
 let h=`<div class="card" style="margin-top:12px"><h3 style="margin:0 0 4px">Compras a meses</h3>`;
 if(!B.debts.length)h+=`<p class="note">¡Terminaste el préstamo! Agrega aquí una compra a meses y llevaré el control de sus pagos.</p>`;
 h+=`<div class="row"><input id="dn" placeholder="Compra"><label>Monto de la compra<input id="dp" type="number" step="0.01"></label><label>Total a pagar<input id="dt" type="number" step="0.01" placeholder="igual al monto"></label><label>Meses<input id="dmo" type="number" min="1" max="60" step="1"></label><label>Mensualidad (opcional)<input id="dmn" type="number" step="0.01" placeholder="se calcula sola"></label><label>Primer pago<input id="dd" type="date" value="${nx30()}"></label><button class="btn f" data-act="dadd">Crear plan</button></div></div>`;
 B.debts.forEach(D=>{
  const pd=dpaid(D),rs=r2(D.total-pd),pc=Math.min(100,pd/D.total*100),n=D.pay.filter((p,k)=>stt(p.a,ds(D,k+1),addM(D.start,k))==='Pagado').length;
  h+=`<div class="card" style="margin-top:12px"><div class="row" style="justify-content:space-between"><h3 style="margin:0">${esc(D.n)}</h3><span class="note" style="margin:0">Compra ${M(D.price)} · Total ${M(D.total)} · ${D.months} pagos</span></div>
  <div class="row"><label>Mensualidad (puedes cambiarla)<input type="number" step="0.01" data-df="mo" data-d="${D.id}" value="${mens(D)}"></label></div>
  <div class="grid" style="margin-top:8px"><div class="card"><small>Pagado</small><b>${M(pd)}</b></div><div class="card"><small>Saldo restante</small><b>${M(rs)}</b></div><div class="card"><small>Pagos completos</small><b>${n} de ${D.months}</b></div></div>
  <div class="bar"><i style="width:${pc}%"></i></div>
  <div class="wrap"><table><tr><th>#</th><th>Fecha</th><th>Programado</th><th>Pagado</th><th>Fecha real</th><th>Estatus</th><th></th></tr>`;
  D.pay.forEach((p,k)=>{const s=stt(p.a,ds(D,k+1),addM(D.start,k));h+=`<tr><td>${k+1}</td><td>${fmtD(addM(D.start,k))}</td><td>${M(ds(D,k+1))}</td>
  <td><input type="number" step="0.01" data-df="a" data-d="${D.id}" data-i="${k}" value="${p.a||''}"></td>
  <td><input type="date" data-df="d" data-d="${D.id}" data-i="${k}" value="${p.d}"></td>
  <td class="st ${s}">${s}</td>
  <td>${(+p.a)>0?`<button class="btn" data-act="dundo" data-d="${D.id}" data-i="${k}">Deshacer</button>`:`<button class="btn f" data-act="dmark" data-d="${D.id}" data-i="${k}">Marcar pagado</button>`}</td></tr>
  <tr><td></td><td colspan="6"><input class="w" placeholder="Nota o referencia" data-df="n" data-d="${D.id}" data-i="${k}" value="${esc(p.n)}"></td></tr>`});
  h+=`</table></div><div class="row" style="margin-top:10px">${cfm===D.id?`<span class="note" style="margin:0">¿Eliminar esta compra y sus pagos?</span><button class="btn f" data-act="ddely" data-d="${D.id}">Sí, eliminar</button><button class="btn" data-act="ddeln">Cancelar</button>`:`<button class="btn" data-act="ddel" data-d="${D.id}">Eliminar compra</button>`}</div></div>`});
 return h}

function decorate(){document.querySelectorAll('table').forEach(t=>{const hs=[...t.querySelectorAll('th')].map(x=>x.textContent);t.querySelectorAll('tr').forEach(r=>{const c=r.children;if(!c.length||c[0].tagName!=='TD')return;if(c.length>=7){[...c].forEach((x,k)=>{if(hs[k])x.setAttribute('data-label',hs[k])});r.classList.add('dr')}else if(c.length===2)r.classList.add('nr')})})}
function sumText(){const paid=S.pay.reduce((t,p)=>t+(+p.a||0),0),rest=r2(S.total-paid),pc=S.total?(paid/S.total*100).toFixed(1):0;
 let s='Préstamo familiar - resumen al '+fmtD(today())+'\nMonto: '+M(S.total)+'\nPagado: '+M(paid)+'\nSaldo restante: '+M(rest)+' ('+pc+'% liquidado)\n\nPagos:';
 S.pay.forEach((p,i)=>{const st=status(i);s+='\n'+(i+1)+') '+fmtD(due(i+1))+' - '+M(sched(i+1))+' - '+(st==='Pagado'?'Pagado'+(p.d?' el '+fmtD(p.d):''):st==='Parcial'?'Parcial ('+M(p.a)+')':st)});return s}
let role='',fails=0,lockT=0;
try{role=sessionStorage.getItem('role')||''}catch(e){}
const USERS={admin:{h:'812ef87598ce1ffdde097ebc024bce3923cb68567488aa7b36deca565a0b3d42',r:'admin'},invitado:{h:'37640f55328ae1422cc65a3cb5a7764f1202d433a0114dfdf0ddbdd25c3605b6',r:'guest'}};
const can=()=>role==='admin';
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function doLogin(){const u=($('#lu').value||'').trim().toLowerCase(),pw=$('#lp').value||'',m=$('#lerr');
 if(Date.now()<lockT){m.textContent='Demasiados intentos. Espera unos segundos.';return}
 if(!(window.crypto&&crypto.subtle)){m.textContent='Este navegador no permite iniciar sesión aquí. Abre la página con https.';return}
 const U=Object.prototype.hasOwnProperty.call(USERS,u)?USERS[u]:null;let ok=false;try{ok=!!U&&(await sha(u+':'+pw))===U.h}catch(e){}
 if(ok){role=U.r;fails=0;try{sessionStorage.setItem('role',role)}catch(e){}tab='loan';render()}
 else{fails++;if(fails>=3){lockT=Date.now()+10000;fails=0}m.textContent='Usuario o contraseña incorrectos.'}}
function logout(){role='';try{sessionStorage.removeItem('role')}catch(e){}render()}
function render(){
 document.body.classList.toggle('auth',!role);
 if(!role){$('#lo').style.display='none';document.querySelector('.tabs').style.display='none';$('#sync').textContent='';$('#msg').textContent=err;
  if(!$('#lu')){$('#app').innerHTML=`<div class="lg"><div class="logo">💰</div><h2>Mis finanzas</h2><p class="s">Inicia sesión para continuar</p>
  <div class="box"><label>Usuario<div class="fld"><input id="lu" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="admin o invitado"></div></label>
  <label>Contraseña<div class="fld pw"><input id="lp" type="password" autocomplete="current-password" placeholder="Tu contraseña"><button type="button" class="eye" data-act="eye">Ver</button></div></label>
  <p id="lerr" class="lerr"></p><button class="btn f go" data-act="login">Entrar</button></div>
  <p class="foot">🔒 Acceso privado</p></div>`;try{$('#lu').focus()}catch(e){}}
  return}
 $('#lo').style.display='inline-block';
 if(!can())tab='loan';
 document.querySelector('.tabs').style.display=can()?'flex':'none';
 document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
 const paid=S.pay.reduce((t,p)=>t+(+p.a||0),0),rest=r2(S.total-paid),pct=S.total?Math.min(100,paid/S.total*100):0;
 const nOk=S.pay.filter((p,i)=>status(i)==='Pagado').length;
 let h='';
 if(tab==='loan'){
  h+=`<div class="grid"><div class="card"><small>Pagado</small><b>${M(paid)}</b></div><div class="card"><small>Saldo restante</small><b>${M(rest)}</b></div><div class="card"><small>Pagos completos</small><b>${nOk} de 9</b></div></div>
  <div class="card"><b>${pct.toFixed(1)}%</b> liquidado<div class="bar"><i style="width:${pct}%"></i></div></div>
  <div class="card" style="margin-top:12px"><div class="row">
  <label>Monto del préstamo<input type="number" step="0.01" data-s="total" value="${S.total}"></label>
  <label>Pago mensual<input type="number" step="0.01" data-s="monthly" value="${S.monthly}"></label>
  <label>Primer pago (mes)<input type="month" data-s="start" value="${S.start.slice(0,7)}"></label>
  <label>Día de pago<input type="number" min="1" max="31" step="1" data-s="day" value="${S.day}"></label></div></div>
  <div class="card wrap" style="margin-top:12px"><table><tr><th>#</th><th>Fecha</th><th>Programado</th><th>Pagado</th><th>Fecha real</th><th>Estatus</th><th></th></tr>`;
  S.pay.forEach((p,i)=>{const st=status(i);h+=`<tr><td>${i+1}</td><td>${fmtD(due(i+1))}</td><td>${M(sched(i+1))}</td>
  <td><input type="number" step="0.01" data-f="a" data-i="${i}" value="${p.a||''}"></td>
  <td><input type="date" data-f="d" data-i="${i}" value="${p.d}"></td>
  <td class="st ${st}">${st}</td>
  <td>${(+p.a)>0?`<button class="btn" data-act="undo" data-i="${i}">Deshacer</button>`:`<button class="btn f" data-act="mark" data-i="${i}">Marcar pagado</button>`}</td></tr>

  ${ld?debtsHtml():''}<div class="card" style="margin-top:12px"><h3 style="margin:0 0 2px">Gastos de la quincena</h3>

document.addEventListener('click',e=>{

 else if(a==='stpay'||a==='stundo'||a==='stdel'){const x=B.stm.find(z=>z.id===t.dataset.x);if(x){if(a==='stpay')x.pd=today();else if(a==='stundo')x.pd='';else B.stm=B.stm.filter(z=>z!==x);saveB()}}
 else if(t.dataset.d&&B.debts.some(x=>x.id===t.dataset.d)){const D=B.debts.find(x=>x.id===t.dataset.d);
  if(a==='dmark'){D.pay[i]={a:ds(D,i+1),d:today(),n:D.pay[i].n};saveB()}
